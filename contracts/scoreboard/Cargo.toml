[package]
name = "vaeltrix-scoreboard"
description = "Per-period stats anchored by observers and claim outcomes pushed by the bond contract. Holds no funds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
vaeltrix-types = { workspace = true }
vaeltrix-verdict = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[lints]
workspace = true
