[package]
name = "vaeltrix-bond"
description = "Holds every token: commitments, stake, claims, challenges, resolution and exits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
vaeltrix-types = { workspace = true }
vaeltrix-verdict = { workspace = true }

[dev-dependencies]
vaeltrix-registry = { path = "../registry" }
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = { workspace = true }

[lints]
workspace = true
