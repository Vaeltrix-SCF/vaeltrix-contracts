[package]
name = "vaeltrix-registry"
description = "Identity and configuration: providers, SLA templates, observers, params and the admin timelock. Holds no funds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
