[dependencies]
soroban-sdk = { workspace = true }
vaeltrix-types = { workspace = true }
vaeltrix-verdict = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
soroban-sdk = { workspace = true, features = ["testutils"] }

[lints]
workspace = true
