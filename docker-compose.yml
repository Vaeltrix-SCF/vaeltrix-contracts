services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vaeltrix
      POSTGRES_PASSWORD: vaeltrix
      POSTGRES_DB: vaeltrix
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaeltrix -d vaeltrix"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
