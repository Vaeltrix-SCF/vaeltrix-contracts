[workspace]
resolver = "3"
members = ["crates/*", "contracts/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Pinned to the SDK that matches the network protocol (testnet and mainnet are on
# Protocol 29 as of Oct 2026). See docs/toolchain.md before changing this.
soroban-sdk = "29.0.1"
vaeltrix-types = { path = "crates/vaeltrix-types" }
vaeltrix-verdict = { path = "crates/vaeltrix-verdict" }

# Dev-only
proptest = "1"
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Guide §8.5: no unwrap/expect/panic in contract code. Tests opt out locally.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "warn"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
